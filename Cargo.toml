[workspace]
resolver = "3"
members = ["crates/neatwork-core", "crates/neatwork-cli", "crates/neatwork-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
