spring.application.name=backend-neatwork
server.port=8080
# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/neatworkapp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#spring.jackson.serialization.write-dates-as-timestamps=false

# Hibernate JSONB serialization
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Python FastAPI Core URL
neatwork.python-core.base-url=${NEATWORK_PYTHON_CORE_BASE_URL:http://localhost:8000}
management.endpoints.web.exposure.include=health, info
neatwork.workspace.root-dir=${NEATWORK_WORKSPACE_ROOT:./neatwork-workspace}

# File upload directory
neatwork.files.upload-dir=./data/uploads
